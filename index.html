<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voting &amp; Apportionment Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout idea: an election-night results board. Dark civic signage board on top,
   clues arrive as paper ballots that slide up out of a slot; teams sit on the tally strip below. */
:root {
  --night: #0b1322;      /* board background */
  --panel: #142039;      /* tile */
  --panel-hi: #1c2c4d;   /* tile hover */
  --paper: #f4f2ec;      /* ballot paper */
  --paper-ink: #131c2c;  /* text on paper */
  --signal: #e5432f;     /* ballot red, the one accent */
  --muted: #8b98b3;      /* secondary text on night */
  --rule: #2a3a5e;       /* lines on night */
  --gold: #f0bf45;       /* daily double only */
  --good: #2f9e62;
  --bad: #c9372a;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Public Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--night);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  display: grid;
  grid-template-rows: auto 1fr auto;
  overflow: hidden;
}
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, .tile:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- header ---------- */
header {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 14px clamp(16px, 2.5vw, 32px) 10px;
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.brand h1 {
  margin: 0; font-family: var(--display); font-weight: 900; text-transform: uppercase;
  font-size: clamp(28px, 3.4vw, 46px); letter-spacing: .02em; line-height: .9; text-wrap: balance;
}
.brand h1 span { color: var(--signal); }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }
.hdr-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.ghost {
  background: transparent; color: var(--paper); border: 1px solid var(--rule);
  padding: 7px 14px; border-radius: 4px; font-size: 14px; font-weight: 600;
}
.ghost:hover { border-color: var(--muted); }
.final-btn { background: var(--signal); border-color: var(--signal); }
.final-btn:hover { filter: brightness(1.08); border-color: var(--signal); }
.final-btn[disabled] { opacity: .45; cursor: default; filter: none; }

/* ---------- board ---------- */
main { min-height: 0; padding: 14px clamp(16px, 2.5vw, 32px); overflow: auto; }
.board {
  height: 100%; min-height: 420px;
  display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr));
  grid-template-rows: auto repeat(5, 1fr); gap: 8px;
}
.cat {
  display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
  padding: 6px 4px 10px; border-bottom: 3px solid var(--signal);
}
.cat b {
  font-family: var(--display); font-weight: 800; text-transform: uppercase;
  font-size: clamp(17px, 1.7vw, 26px); line-height: 1; letter-spacing: .02em; text-wrap: balance;
}
.cat small { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
.tile {
  position: relative; border: 0; border-radius: 4px;
  background: var(--panel); color: var(--paper);
  font-family: var(--display); font-weight: 800; font-variant-numeric: tabular-nums;
  font-size: clamp(30px, 3.6vw, 58px); letter-spacing: .01em;
  display: grid; place-items: center; min-height: 64px;
  transition: background .15s, transform .15s;
}
/* perforated ballot-stub edge */
.tile::before {
  content: ""; position: absolute; left: 10px; right: 10px; top: 9px; height: 0;
  border-top: 2px dotted var(--rule);
}
.tile:hover:not(.used) { background: var(--panel-hi); transform: translateY(-2px); }
.tile.used { background: transparent; border: 1px dashed var(--rule); color: transparent; cursor: default; }
.tile.used::after {
  content: "COUNTED"; position: absolute; inset: auto; color: var(--rule);
  font-size: clamp(13px, 1.1vw, 17px); letter-spacing: .18em; transform: rotate(-8deg);
  border: 2px solid var(--rule); padding: 2px 8px; border-radius: 3px;
}
.tile.used::before { display: none; }

/* ---------- scoreboard ---------- */
.tally {
  border-top: 1px solid var(--rule);
  padding: 10px clamp(16px, 2.5vw, 32px) 14px;
  display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap;
}
.team {
  flex: 1 1 170px; max-width: 320px;
  background: var(--panel); border-radius: 4px; padding: 8px 12px 10px;
  display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; gap: 2px 8px;
  border-top: 4px solid var(--c, var(--muted));
}
.team input {
  grid-column: 1 / -1; background: transparent; border: 0; color: var(--paper);
  font: 600 14px var(--body); padding: 2px 0; width: 100%;
  border-bottom: 1px dashed transparent;
}
.team input:hover, .team input:focus { border-bottom-color: var(--rule); outline: none; }
.score {
  font-family: var(--display); font-weight: 900; font-size: clamp(30px, 3vw, 44px);
  line-height: 1; font-variant-numeric: tabular-nums;
}
.score.neg { color: var(--signal); }
.adj { display: flex; gap: 4px; align-items: end; }
.adj button {
  width: 34px; height: 30px; border-radius: 4px; border: 1px solid var(--rule);
  background: transparent; color: var(--paper); font-weight: 700; font-size: 13px;
}
.adj button:hover { border-color: var(--muted); }
.team-ctl { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
.tcount { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.tcount input {
  width: 60px; padding: 5px 6px; background: transparent; color: var(--paper);
  border: 1px solid var(--rule); border-radius: 4px; font: 700 16px var(--body); font-variant-numeric: tabular-nums;
}
/* compact scoreboard for 7–15 teams: two tidy rows instead of a tall stack */
.tally.dense { display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 6px; padding-top: 8px; padding-bottom: 10px; }
.tally.dense .team { max-width: none; padding: 4px 8px 6px; gap: 0 4px; border-top-width: 3px; }
.tally.dense .team input { font-size: 12px; }
.tally.dense .score { font-size: 24px; }
.tally.dense .adj button { width: 24px; height: 22px; font-size: 12px; }

/* ---------- ballot (modal) ---------- */
.slot {
  position: fixed; inset: 0; display: none; place-items: end center;
  background: rgba(6, 10, 20, .72); z-index: 10; padding: 16px;
}
.slot.open { display: grid; }
.ballot {
  width: min(1040px, 100%); max-height: calc(100% - 8px); overflow: auto;
  background: var(--paper); color: var(--paper-ink);
  border-radius: 6px 6px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.45);
  padding: clamp(18px, 3vw, 36px) clamp(18px, 3.4vw, 44px) 24px;
  animation: rise .42s cubic-bezier(.2,.8,.2,1);
  position: relative;
}
.ballot::before { /* ballot tear-off perforation */
  content: ""; position: absolute; left: 0; right: 0; top: 10px; border-top: 2px dotted #c9c4b6;
}
@keyframes rise { from { transform: translateY(105%); } to { transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) { .ballot { animation: none; } .tile { transition: none; } }

.b-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.b-cat { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 22px; letter-spacing: .04em; }
.b-cat small { font-family: var(--body); font-weight: 600; font-size: 13px; color: #6b7280; letter-spacing: .02em; text-transform: none; margin-left: 8px; }
.b-val { font-family: var(--display); font-weight: 900; font-size: 40px; color: var(--signal); line-height: 1; font-variant-numeric: tabular-nums; }
.b-val.dd { color: #b8860b; }
.clue { font-size: clamp(19px, 2vw, 27px); line-height: 1.4; max-width: 62ch; }
.clue p { margin: 0 0 .6em; }
.answer {
  margin-top: 18px; padding-top: 16px; border-top: 3px solid var(--signal);
  font-size: clamp(16px, 1.55vw, 21px); line-height: 1.5;
}
.answer .ans-lead { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 2.4vw, 34px); text-transform: uppercase; line-height: 1.05; margin: 0 0 8px; letter-spacing: .01em; }
.answer p { margin: 0 0 .5em; max-width: 70ch; }
.answer ol, .answer ul { margin: 0 0 .5em; padding-left: 1.3em; }
.tables { display: flex; gap: 22px; flex-wrap: wrap; margin: 4px 0 12px; }
.tables figure { margin: 0; overflow-x: auto; }
.tables figcaption { font-size: 14px; font-weight: 700; color: #4b5563; margin-bottom: 4px; }
table.sch { border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: clamp(16px, 1.6vw, 22px); }
table.sch th, table.sch td { padding: 4px 12px; text-align: center; border-bottom: 1px solid #d6d1c3; }
table.sch thead th { border-bottom: 2px solid var(--paper-ink); font-weight: 700; }
table.sch tbody th { text-align: left; font-weight: 600; color: #4b5563; border-right: 2px solid var(--paper-ink); }
table.sch td.hl { background: #fde4df; font-weight: 700; }
.key { font-size: 14px; color: #4b5563; margin: -4px 0 10px; }

.b-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }
.btn { border: 0; border-radius: 4px; padding: 10px 18px; font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--paper-ink); color: var(--paper); }
.btn.primary:hover { background: #233150; }
.btn.line { background: transparent; border: 1.5px solid var(--paper-ink); color: var(--paper-ink); }
.btn.line:hover { background: #e8e4d9; }
.spacer { flex: 1; }
.timer { display: flex; align-items: center; gap: 10px; }
.clock {
  font-family: var(--display); font-weight: 900; font-size: 34px; min-width: 2.3ch; text-align: right;
  font-variant-numeric: tabular-nums; color: var(--paper-ink);
}
.clock.low { color: var(--signal); }
.clock.done { animation: blink .5s steps(2) 6; color: var(--signal); }
@keyframes blink { 50% { opacity: .15; } }
.tbar { width: 120px; height: 6px; background: #ddd8cb; border-radius: 3px; overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: var(--paper-ink); transform-origin: left; }

.award { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
.award .who {
  display: flex; align-items: center; gap: 6px; background: #ebe7dc; border-radius: 4px; padding: 6px 8px 6px 12px;
  border-left: 4px solid var(--c);
}
.award .who span { font-weight: 700; font-size: 15px; margin-right: 4px; }
.award button { border: 0; border-radius: 3px; padding: 6px 10px; font-weight: 700; font-size: 14px; color: #fff; }
.award .yes { background: var(--good); }
.award .no { background: var(--bad); }
.award button[disabled] { opacity: .35; cursor: default; }
.award .who.done span::after { content: " ✓"; }
.label { font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #6b7280; width: 100%; }

.dd-splash { text-align: center; padding: 10px 0 4px; }
.dd-splash h2 {
  font-family: var(--display); font-weight: 900; text-transform: uppercase; margin: 0;
  font-size: clamp(54px, 8vw, 110px); line-height: .9; color: var(--signal); letter-spacing: .02em;
}
.dd-splash p { font-size: 18px; margin: 10px 0 16px; }
.pick { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 14px; }
.pick button { border: 1.5px solid var(--paper-ink); background: transparent; color: var(--paper-ink); padding: 8px 14px; border-radius: 4px; font-weight: 700; border-left: 6px solid var(--c); }
.pick button[aria-pressed="true"] { background: var(--paper-ink); color: var(--paper); }
.wager { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.wager input, .fw input {
  width: 120px; padding: 8px 10px; font: 700 18px var(--body); border: 1.5px solid var(--paper-ink);
  border-radius: 4px; background: #fff; color: var(--paper-ink); font-variant-numeric: tabular-nums;
}
.hint { font-size: 14px; color: #6b7280; margin-top: 6px; }
.fw-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin: 12px 0; }
.fw { background: #ebe7dc; border-radius: 4px; padding: 10px 12px; border-left: 5px solid var(--c); display: grid; gap: 6px; }
.fw b { font-size: 16px; }
.fw label { font-size: 13px; color: #4b5563; }
.err { color: var(--bad); font-size: 14px; font-weight: 600; min-height: 1.2em; }

.confirm p { font-size: 20px; margin: 4px 0 6px; }

@media (max-width: 720px) {
  body { overflow: auto; height: auto; min-height: 100%; }
  .board { grid-template-columns: repeat(5, minmax(96px, 1fr)); min-width: 520px; }
  main { overflow-x: auto; }
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Election Night <span>Jeopardy</span></h1>
    <p>Math 141 · Voting &amp; apportionment</p>
  </div>
  <div class="hdr-actions">
    <button class="ghost final-btn" id="finalBtn" type="button">Final Jeopardy</button>
    <button class="ghost" id="resetBtn" type="button">New game</button>
  </div>
</header>

<main><div class="board" id="board" aria-label="Game board"></div></main>

<section class="tally" id="tally" aria-label="Team scores"></section>

<div class="slot" id="slot" role="dialog" aria-modal="true" aria-labelledby="bCat">
  <article class="ballot" id="ballot"></article>
</div>

<script>
/* ================= helpers for clue content ================= */
function sch(cols, rows, hl) {
  // cols: voter counts; rows: [label, [cells]]; hl: set of "r,c" to highlight
  hl = hl || [];
  let h = '<table class="sch"><thead><tr><th scope="col"></th>' +
    cols.map(c => '<th scope="col">' + c + '</th>').join('') + '</tr></thead><tbody>';
  rows.forEach((r, i) => {
    h += '<tr><th scope="row">' + r[0] + '</th>' +
      r[1].map((x, j) => '<td' + (hl.includes(i + ',' + j) ? ' class="hl"' : '') + '>' + x + '</td>').join('') + '</tr>';
  });
  return h + '</tbody></table>';
}
function tbl(head, rows) {
  return '<table class="sch"><thead><tr>' + head.map((c, i) => '<th scope="col">' + c + '</th>').join('') +
    '</tr></thead><tbody>' + rows.map(r => '<tr><th scope="row">' + r[0] + '</th>' +
    r.slice(1).map(x => '<td>' + x + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}
function fig(cap, inner) { return '<figure><figcaption>' + cap + '</figcaption>' + inner + '</figure>'; }
function tables() { return '<div class="tables">' + [].slice.call(arguments).join('') + '</div>'; }

const PIZZA = sch([18, 12, 10, 5], [
  ['1st', ['P', 'M', 'S', 'S']],
  ['2nd', ['S', 'S', 'M', 'P']],
  ['3rd', ['M', 'P', 'P', 'M']]]);
const PIZZA_KEY = '<p class="key">P = Pepperoni · S = Sausage · M = Mushroom · 45 voters</p>';
const COUNCIL = sch([15, 12, 2, 11, 13], [
  ['1st', ['B', 'A', 'C', 'D', 'D']],
  ['2nd', ['A', 'C', 'D', 'C', 'C']],
  ['3rd', ['C', 'B', 'A', 'B', 'A']],
  ['4th', ['D', 'D', 'B', 'A', 'B']]]);
const COUNCIL_KEY = '<p class="key">Student council: Ana, Ben, Cara, Dev · 53 voters</p>';

/* ================= the clues ================= */
const CATS = [
  { name: 'Count the Votes', clues: [
    { q: '<p>An election has <b>5 candidates</b>.</p><p>In the Borda count, how many points is a 1st-place vote worth? A last-place vote? How many head-to-head matchups does pairwise comparison need?</p>',
      lead: '5 points, 1 point, 10 matchups',
      a: '<p>Borda gives n points for 1st down to 1 point for last, so 1st = 5 and last = 1.</p><p>Matchups = n(n − 1) ÷ 2 = 5 · 4 ÷ 2 = <b>10</b>.</p>' },
    { q: '<p>Pizza vote. Who wins by <b>plurality</b>? Does the winner have a majority?</p>' + tables(PIZZA) + PIZZA_KEY,
      lead: 'Pepperoni, but no majority',
      a: '<p>First-place votes: P 18, S 10 + 5 = 15, M 12. Pepperoni wins.</p><p>A majority of 45 is 23 or more. 18 is only 40%, so there is <b>no majority</b>. Plurality doesn\'t need one.</p>' },
    { q: '<p>Same pizza vote. Use the <b>Borda count</b>. Give every topping\'s points.</p>' + tables(PIZZA) + PIZZA_KEY,
      lead: 'Sausage 105 · Pepperoni 86 · Mushroom 79',
      a: '<p>1st = 3, 2nd = 2, 3rd = 1.</p><ul><li>S: 15·3 + 30·2 + 0·1 = <b>105</b></li><li>P: 18·3 + 5·2 + 22·1 = 86</li><li>M: 12·3 + 10·2 + 23·1 = 79</li></ul><p>Sausage wins, even though Pepperoni won plurality.</p>' },
    { q: '<p>Student council election. Use <b>plurality with elimination</b>. Who wins, and what is the final count?</p>' + tables(COUNCIL) + COUNCIL_KEY,
      lead: 'Ben, 27–26',
      a: '<ol><li>Round 1: Ana 12, Ben 15, Cara 2, Dev 24. Eliminate Cara; her 2 voters go to Dev → Dev 26.</li><li>Round 2: Ana 12, Ben 15, Dev 26. Eliminate Ana; her 12 voters skip Cara (gone) and go to Ben → Ben 27.</li><li>Round 3: Ben 27, Dev 26. 27 is a majority of 53, so <b>Ben wins</b>.</li></ol>' },
    { q: '<p>Same council election. Use <b>pairwise comparison</b>. Give each candidate\'s points and the winner.</p>' + tables(COUNCIL) + COUNCIL_KEY,
      lead: 'Ana wins with 3 points',
      a: '<ul><li>Ana beats Ben 27–26, Cara 27–26, Dev 27–26</li><li>Cara beats Ben 38–15 and Dev 29–24</li><li>Ben beats Dev 27–26</li></ul><p>Points: <b>Ana 3</b>, Cara 2, Ben 1, Dev 0.</p>' }
  ]},
  { name: 'Fair or Foul?', clues: [
    { q: '<p>Name the fairness criterion:</p><p>“A candidate who beats every other candidate in a head-to-head matchup should win.”</p>',
      lead: 'Condorcet criterion',
      a: '<p>“You beat everybody head-to-head? You should win.” Plurality can violate it.</p>' },
    { q: '<p>Pairwise comparison picks A. Then candidate E, who lost, drops out. Nobody changes their ballots, but now B wins.</p><p>Which fairness criterion was violated?</p>',
      lead: 'Independence of irrelevant alternatives',
      a: '<p>Removing a <i>losing</i> candidate should not change the winner. Here it did, so the irrelevant alternatives criterion is violated.</p>' },
    { q: '<p>Run the <b>Borda count</b>. Who wins? Which fairness criterion does this violate?</p>' +
        tables(sch([7, 3, 3], [['1st', ['A', 'B', 'C']], ['2nd', ['B', 'C', 'B']], ['3rd', ['C', 'D', 'D']], ['4th', ['D', 'A', 'A']]])),
      lead: 'B wins; majority criterion violated',
      a: '<p>Points 4-3-2-1: A 7·4 + 6·1 = 34 · <b>B 42</b> · C 35 · D 19.</p><p>A has 7 of 13 first-place votes, a majority, but loses. Borda violated the <b>majority criterion</b>.</p>' },
    { q: '<p>Who wins by <b>plurality</b>? Is there a Condorcet candidate? Which criterion fails?</p>' +
        tables(sch([40, 35, 25], [['1st', ['A', 'B', 'C']], ['2nd', ['B', 'C', 'B']], ['3rd', ['C', 'D', 'D']], ['4th', ['D', 'A', 'A']]])),
      lead: 'A wins; B is the Condorcet candidate',
      a: '<p>Plurality: A wins with 40 of 100.</p><ul><li>B vs A: 35 + 25 = <b>60</b> to 40</li><li>B vs C: 40 + 35 = <b>75</b> to 25</li><li>B vs D: <b>100</b> to 0</li></ul><p>B beats everyone head-to-head but loses, so plurality violated the <b>Condorcet criterion</b>.</p>' },
    { q: '<p>Run <b>plurality with elimination</b> on both schedules. In Schedule 2, the 2 voters in the last column moved B up to 1st. Who wins each time? Which criterion fails?</p>' +
        tables(
          fig('Schedule 1', sch([12, 9, 8, 2], [['1st', ['B', 'C', 'A', 'A']], ['2nd', ['A', 'B', 'C', 'B']], ['3rd', ['C', 'A', 'B', 'C']]])),
          fig('Schedule 2', sch([12, 9, 8, 2], [['1st', ['B', 'C', 'A', 'B']], ['2nd', ['A', 'B', 'C', 'A']], ['3rd', ['C', 'A', 'B', 'C']]], ['0,3', '1,3']))),
      lead: 'B wins, then C wins: monotonicity',
      a: '<p><b>Schedule 1:</b> A 10, B 12, C 9 → drop C; C\'s 9 go to B → B 21, A 10. <b>B wins.</b></p><p><b>Schedule 2:</b> A 8, B 14, C 9 → drop A; A\'s 8 go to C → C 17, B 14. <b>C wins.</b></p><p>Ranking B <i>higher</i> made B lose, which violates the <b>monotonicity criterion</b>.</p>' }
  ]},
  { name: 'Divide It Up', clues: [
    { q: '<p>In words: what does the <b>standard divisor</b> tell you? And what must the <b>standard quotas</b> always add up to?</p>',
      lead: 'People per seat; the total seats',
      a: '<p>Standard divisor = total population ÷ total seats: how many people one seat represents.</p><p>The standard quotas always add up to the total number of seats (or items).</p>' },
    { q: '<p>A county of <b>84,000</b> people has <b>12</b> council seats. Find the standard divisor. What is the standard quota of a town with 25,200 people, and its lower and upper quota?</p>',
      lead: '7,000; quota 3.6 (lower 3, upper 4)',
      a: '<p>SD = 84,000 ÷ 12 = <b>7,000</b> people per seat.</p><p>Quota = 25,200 ÷ 7,000 = <b>3.6</b>, so the lower quota is 3 and the upper quota is 4.</p>' },
    { q: '<p>Four cousins split <b>40</b> pieces of candy by weight. Find the standard divisor and each cousin\'s standard quota.</p>' +
        tables(tbl(['Cousin', 'Weight (lb)'], [['Maya', 95], ['Leo', 62], ['Ivy', 78], ['Sam', 55]])),
      lead: 'SD 7.25; 13.10 · 8.55 · 10.76 · 7.59',
      a: '<p>SD = 290 ÷ 40 = <b>7.25 lb per piece</b>.</p><p>Maya 95 ÷ 7.25 = 13.10 · Leo 8.55 · Ivy 10.76 · Sam 7.59. They add to 40.</p>' },
    { q: '<p>Same cousins (quotas 13.10, 8.55, 10.76, 7.59). Use <b>Hamilton\'s method</b> to hand out the 40 pieces.</p>',
      lead: 'Maya 13, Leo 8, Ivy 11, Sam 8',
      a: '<ol><li>Round down: 13 + 8 + 10 + 7 = 38. Two pieces are left.</li><li>Largest decimal parts: Ivy .76 and Sam .59. Leo (.55) just misses.</li></ol><p>Maya 13, Leo 8, Ivy 11, Sam 8.</p>' },
    { q: '<p>Four schools share <b>30</b> computers by enrollment. Use <b>Jefferson\'s method</b>. Find a modified divisor that works and give each school\'s computers.</p>' +
        tables(tbl(['School', 'Enrollment'], [['A', '2,600'], ['B', '3,710'], ['C', '3,240'], ['D', '2,990']])),
      lead: '6 · 9 · 8 · 7',
      a: '<p>SD = 12,540 ÷ 30 = 418. Rounded down: 6 + 8 + 7 + 7 = 28, too few, so <b>decrease</b> the divisor.</p><p>Divisor 400: 6.5 → 6 · 9.28 → 9 · 8.1 → 8 · 7.48 → 7. Total 30.</p><p>Any divisor from about 374 to 405 works.</p>' }
  ]},
  { name: 'Pick a Method', clues: [
    { q: '<p>How does each method round the quotas: <b>Hamilton</b>, <b>Jefferson</b>, <b>Adams</b>, <b>Webster</b>?</p>',
      lead: 'Down, down, up, nearest',
      a: '<p>Hamilton and Jefferson round down. Adams rounds up. Webster rounds to the nearest whole number (.5 rounds up).</p>' },
    { q: '<p>A state\'s standard quota is <b>7.62</b>. Under the Quota Rule, how many seats may it get? Which method always follows the Quota Rule?</p>',
      lead: '7 or 8 seats; Hamilton',
      a: '<p>The Quota Rule allows only the lower quota (7) or the upper quota (8). Hamilton\'s method always satisfies it.</p>' },
    { q: '<p><b>Hamilton\'s method</b>, 50 seats. Find the apportionment.</p>' +
        tables(tbl(['State', 'Population'], [['A', '1,840'], ['B', '3,570'], ['C', '2,290'], ['D', '960'], ['E', '1,340']])),
      lead: '9 · 18 · 11 · 5 · 7',
      a: '<p>SD = 10,000 ÷ 50 = 200. Quotas 9.2, 17.85, 11.45, 4.8, 6.7. Lower quotas add to 47, so 3 seats are left.</p><p>Largest decimals: B .85, D .8, E .7 → A 9, B 18, C 11, D 5, E 7.</p>' },
    { q: '<p><b>Adams\' method</b>, 30 seats. Find a modified divisor that works and give each state\'s seats.</p>' +
        tables(tbl(['State', 'Population'], [['A', '1,690'], ['B', '3,500'], ['C', '1,340'], ['D', '2,500']])),
      lead: '6 · 11 · 5 · 8',
      a: '<p>SD = 9,030 ÷ 30 = 301. Rounded up: 6 + 12 + 5 + 9 = 32, too many, so <b>increase</b> the divisor.</p><p>Divisor 320: 5.28 → 6 · 10.94 → 11 · 4.19 → 5 · 7.81 → 8. Total 30.</p><p>Any divisor from about 319 to 334 works.</p>' },
    { q: '<p><b>Webster\'s method</b>, 30 seats. Find a modified divisor that works and give each state\'s seats.</p>' +
        tables(tbl(['State', 'Population'], [['A', '3,390'], ['B', '1,180'], ['C', '690'], ['D', '2,240']])),
      lead: '13 · 5 · 3 · 9',
      a: '<p>SD = 7,500 ÷ 30 = 250. Quotas 13.56, 4.72, 2.76, 8.96 round to 14 + 5 + 3 + 9 = 31, too many, so <b>increase</b> the divisor.</p><p>Divisor 260: 13.04 → 13 · 4.54 → 5 · 2.65 → 3 · 8.62 → 9. Total 30.</p><p>Any divisor from about 252 to 262 works.</p>' }
  ]},
  { name: 'Paradox Party', clues: [
    { q: '<p>The total number of seats goes <b>up</b>, and a state <b>loses</b> a seat. Name the paradox.</p>',
      lead: 'Alabama paradox',
      a: '<p>“More seats? Why should I lose seats?” It happened to Alabama in 1880 (299 → 300 seats, 8 → 7).</p>' },
    { q: '<p>Town A grew from 4,000 to 4,200. Town B grew from 9,000 to 9,360. Find each <b>growth rate</b>. Which town grew faster?</p>',
      lead: 'A 5%, B 4%: Town A',
      a: '<p>Growth rate = (current − previous) ÷ previous.</p><p>A: 200 ÷ 4,000 = <b>5%</b>. B: 360 ÷ 9,000 = <b>4%</b>. Town A grew faster even though B added more people.</p>' },
    { q: '<p><b>Hamilton\'s method</b>. Apportion <b>9</b> seats, then <b>10</b> seats. What happens to state C?</p>' +
        tables(tbl(['State', 'Population'], [['A', '850'], ['B', '670'], ['C', '280']])),
      lead: '4-3-2, then 5-4-1',
      a: '<p><b>9 seats:</b> SD 200; quotas 4.25, 3.35, 1.4 → 4 + 3 + 1 = 8; the extra seat goes to C (.4) → <b>4, 3, 2</b>.</p><p><b>10 seats:</b> SD 180; quotas 4.72, 3.72, 1.56 → 4 + 3 + 1 = 8; the 2 extras go to A and B (.72) → <b>5, 4, 1</b>.</p><p>The number of seats went up and C lost a seat: the Alabama paradox.</p>' },
    { q: '<p><b>Hamilton</b>. Riverton (6,540) and Lakeside (3,470) share <b>65</b> seats. Then Pine Hill (1,030) joins with 7 new seats (<b>72</b> total). Give both apportionments. Which paradox is this?</p>',
      lead: 'Before 42-23; after 43-22-7',
      a: '<p><b>Before:</b> SD 154; quotas 42.47, 22.53 → 42 + 22 = 64; the extra goes to Lakeside → <b>42, 23</b>.</p><p><b>After:</b> SD 153.33; quotas 42.65, 22.63, 6.72 → 42 + 22 + 6 = 70; the 2 extras go to Pine Hill (.72) and Riverton (.65) → <b>43, 22, 7</b>.</p><p>Riverton gained and Lakeside lost just because a new town joined: the new states paradox.</p>' },
    { q: '<p><b>Hamilton</b>, 18 seats. Apportion both years, find each growth rate, and name the paradox.</p>' +
        tables(tbl(['City', '2025', '2026'], [['Arden', 312, 331], ['Bexley', 480, 484], ['Corwin', 860, 905]])),
      lead: 'Population paradox',
      a: '<p><b>2025</b> (SD 91.78): 3.40, 5.23, 9.37 → 3 + 5 + 9 = 17; extra to Arden (.40) → <b>4, 5, 9</b>.</p><p><b>2026</b> (SD 95.56): 3.46, 5.07, 9.47 → 17; extra to Corwin (.47) → <b>3, 5, 10</b>.</p><p>Growth: Arden 6.09%, Bexley 0.83%, Corwin 5.23%. Arden grew fastest but lost a seat while slower-growing Corwin gained one.</p>' }
  ]}
];
const VALUES = [100, 200, 300, 400, 500];
const TIMES = [60, 120, 180, 240, 300]; // seconds per value: 1–5 minutes, 3 minutes on average
const DAILY_DOUBLE = '3-3'; // Pick a Method, 400
const FINAL = {
  cat: 'Arrow\'s Election', secs: 240,
  q: '<p>In the student council election, plurality picks Dev, plurality with elimination picks Ben, Borda picks Cara, and pairwise comparison picks Ana. Ana wins every head-to-head matchup.</p><p>(a) Which fairness criterion do plurality, plurality with elimination, and Borda violate here?<br>(b) What theorem says every voting system with 3 or more candidates must violate a fairness criterion?</p>' + tables(COUNCIL) + COUNCIL_KEY,
  lead: '(a) Condorcet · (b) Arrow\'s Impossibility Theorem',
  a: '<p>Ana is the Condorcet candidate (she beats Ben, Cara, and Dev 27–26 each), so the three methods that did not pick her violate the <b>Condorcet criterion</b>.</p><p><b>Arrow\'s Impossibility Theorem:</b> any voting system with at least 3 candidates must violate one of the fairness criteria.</p>'
};

const MAX_TEAMS = 15;

/* ================= state ================= */
const KEY = 'math141-jeopardy-v2';
function freshState() {
  return { teams: [{ name: 'Team 1', score: 0 }, { name: 'Team 2', score: 0 }, { name: 'Team 3', score: 0 }], used: {}, finalDone: false };
}
let S = freshState();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function load(snap) {
  if (snap && snap.teams) return snap;
  try { const raw = localStorage.getItem(KEY); if (raw) { const s = JSON.parse(raw); if (s && s.teams) return s; } } catch (e) {}
  return freshState();
}

/* ================= rendering ================= */
const $ = id => document.getElementById(id);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
// 15 distinct hues, 96° apart, so neighbouring teams never look alike
function color(i) { return 'hsl(' + ((i * 96 + 6) % 360) + ', 68%, 58%)'; }

function renderBoard() {
  let h = CATS.map(c => '<div class="cat"><b>' + c.name + '</b></div>').join('');
  VALUES.forEach((v, r) => {
    CATS.forEach((c, ci) => {
      const id = ci + '-' + r, used = S.used[id];
      h += '<button type="button" class="tile' + (used ? ' used' : '') + '" data-id="' + id + '"' +
        (used ? ' aria-disabled="true" tabindex="-1"' : '') +
        ' aria-label="' + esc(c.name) + ' for ' + v + (used ? ', already played' : '') + '">' + v + '</button>';
    });
  });
  $('board').innerHTML = h;
  $('finalBtn').disabled = !!S.finalDone;
}

function renderTally() {
  const t = $('tally');
  t.innerHTML = S.teams.map((tm, i) =>
    '<div class="team" style="--c:' + color(i) + '">' +
      '<input id="tn' + i + '" value="' + esc(tm.name) + '" aria-label="Team ' + (i + 1) + ' name" data-i="' + i + '">' +
      '<div class="score' + (tm.score < 0 ? ' neg' : '') + '">' + tm.score + '</div>' +
      '<div class="adj"><button type="button" data-adj="-100" data-i="' + i + '" aria-label="Take 100 from ' + esc(tm.name) + '">−</button>' +
      '<button type="button" data-adj="100" data-i="' + i + '" aria-label="Give 100 to ' + esc(tm.name) + '">+</button></div>' +
    '</div>').join('') +
    '<div class="team-ctl"><label class="tcount" for="teamCount">Teams' +
      '<input id="teamCount" type="number" min="1" max="' + MAX_TEAMS + '" step="1" value="' + S.teams.length + '"></label></div>';
  t.classList.toggle('dense', S.teams.length > 6);
}
function setTeamCount(n) {
  n = Math.max(1, Math.min(MAX_TEAMS, Math.round(+n) || 1));
  while (S.teams.length < n) S.teams.push({ name: 'Team ' + (S.teams.length + 1), score: 0 });
  while (S.teams.length > n) S.teams.pop();
  save(); renderTally();
  const f = $('teamCount'); if (f) f.focus();
}

/* ================= ballot (modal) ================= */
let timerId = null, lastFocus = null;
function openSlot(html) {
  lastFocus = document.activeElement;
  $('ballot').innerHTML = html;
  $('slot').classList.add('open');
  const f = $('ballot').querySelector('[data-autofocus]') || $('ballot').querySelector('button, input');
  if (f) f.focus();
}
function closeSlot() {
  stopTimer();
  $('slot').classList.remove('open');
  $('ballot').innerHTML = '';
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
function fmt(t) { return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
function timerHTML(sec) {
  return '<div class="timer"><button type="button" class="btn line" id="tStart">Start ' + fmt(sec) + ' timer</button>' +
    '<div class="tbar" aria-hidden="true"><i id="tBar"></i></div><div class="clock" id="tClock" aria-live="off">' + fmt(sec) + '</div></div>';
}
function wireTimer(sec) {
  const btn = $('tStart'); if (!btn) return;
  btn.onclick = () => {
    stopTimer();
    let left = sec; const end = Date.now() + sec * 1000;
    const clock = $('tClock'), bar = $('tBar');
    clock.className = 'clock'; btn.textContent = 'Restart timer';
    timerId = setInterval(() => {
      left = Math.max(0, (end - Date.now()) / 1000);
      clock.textContent = fmt(Math.ceil(left));
      bar.style.transform = 'scaleX(' + (left / sec) + ')';
      if (left <= 10) clock.classList.add('low');
      if (left <= 0) { stopTimer(); clock.classList.add('done'); }
    }, 100);
  };
}

function headHTML(catName, ws, valueHTML, dd) {
  return '<div class="b-head"><div class="b-cat" id="bCat">' + catName + (ws ? '<small>' + ws + '</small>' : '') + '</div>' +
    '<div class="b-val' + (dd ? ' dd' : '') + '">' + valueHTML + '</div></div>';
}

function openTile(id) {
  if (S.used[id]) return;
  const [ci, r] = id.split('-').map(Number);
  const cat = CATS[ci], clue = cat.clues[r], value = VALUES[r];
  if (id === DAILY_DOUBLE) return openDailyDouble(id, cat, clue, value, TIMES[r]);
  showClue({ id, cat, clue, value, secs: TIMES[r] });
}

function showClue(o) {
  const dd = o.ddTeam != null;
  const valueHTML = dd ? 'Daily Double · ' + o.wager : o.value;
  openSlot(headHTML(o.cat.name, '', valueHTML, dd) +
    '<div class="clue">' + o.clue.q + '</div>' +
    '<div id="ansArea"></div>' +
    '<div class="b-bar" id="bBar">' + timerHTML(o.secs) + '<span class="spacer"></span>' +
      '<button type="button" class="btn line" id="cancel">Back to board</button>' +
      '<button type="button" class="btn primary" id="reveal" data-autofocus>Show answer</button></div>');
  wireTimer(o.secs);
  $('cancel').onclick = closeSlot;
  $('reveal').onclick = () => revealAnswer(o);
}

function revealAnswer(o) {
  stopTimer();
  S.used[o.id] = true; save(); renderBoard();
  const dd = o.ddTeam != null;
  let award = '<div class="award"><div class="label">' + (dd ? 'Score the Daily Double' : 'Score it') + '</div>';
  const teams = dd ? [o.ddTeam] : S.teams.map((_, i) => i);
  const pts = dd ? o.wager : o.value;
  teams.forEach(i => {
    award += '<div class="who" style="--c:' + color(i) + '" data-who="' + i + '"><span>' + esc(S.teams[i].name) + '</span>' +
      '<button type="button" class="yes" data-team="' + i + '" data-pts="' + pts + '">+' + pts + '</button>' +
      '<button type="button" class="no" data-team="' + i + '" data-pts="' + (-pts) + '">−' + pts + '</button></div>';
  });
  award += '</div>';
  $('ansArea').innerHTML = '<div class="answer"><p class="ans-lead">' + o.clue.lead + '</p>' + o.clue.a + '</div>' + award;
  $('bBar').innerHTML = '<span class="spacer"></span><button type="button" class="btn primary" id="done" data-autofocus>Back to board</button>';
  $('done').onclick = closeSlot;
  $('done').focus();
  $('ansArea').querySelectorAll('.award button').forEach(b => b.onclick = () => {
    const i = +b.dataset.team; S.teams[i].score += +b.dataset.pts; save(); renderTally();
    const who = b.closest('.who'); who.classList.add('done'); who.querySelectorAll('button').forEach(x => x.disabled = true);
  });
}

function openDailyDouble(id, cat, clue, value, secs) {
  let pick = null;
  openSlot(headHTML(cat.name, '', value, true) +
    '<div class="dd-splash"><h2>Daily Double</h2><p>Which team found it? They wager before seeing the clue.</p>' +
    '<div class="pick" id="ddPick">' + S.teams.map((t, i) => '<button type="button" aria-pressed="false" data-i="' + i + '" style="--c:' + color(i) + '">' + esc(t.name) + '</button>').join('') + '</div>' +
    '<label class="wager" for="ddWager">Wager <input id="ddWager" type="number" min="5" step="50" inputmode="numeric"></label>' +
    '<div class="hint" id="ddHint">Pick a team to see its maximum wager.</div><div class="err" id="ddErr"></div></div>' +
    '<div class="b-bar"><span class="spacer"></span><button type="button" class="btn line" id="cancel">Back to board</button>' +
    '<button type="button" class="btn primary" id="ddGo">Show the clue</button></div>');
  const maxFor = i => Math.max(S.teams[i].score, 500);
  $('ddPick').querySelectorAll('button').forEach(b => b.onclick = () => {
    pick = +b.dataset.i;
    $('ddPick').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
    $('ddHint').textContent = esc(S.teams[pick].name) + ' can wager 5 to ' + maxFor(pick) + ' (their score, or 500 if that is higher).';
    $('ddWager').max = maxFor(pick); $('ddWager').focus();
  });
  $('cancel').onclick = closeSlot;
  $('ddGo').onclick = () => {
    const w = Math.round(+$('ddWager').value);
    if (pick == null) { $('ddErr').textContent = 'Pick the team that chose this square.'; return; }
    if (!(w >= 5 && w <= maxFor(pick))) { $('ddErr').textContent = 'Enter a wager from 5 to ' + maxFor(pick) + '.'; return; }
    showClue({ id, cat, clue, value, secs, ddTeam: pick, wager: w });
  };
}

function openFinal() {
  if (S.finalDone) return;
  openSlot(headHTML('Final Jeopardy', '', FINAL.cat, false) +
    '<p class="clue">Category: <b>' + FINAL.cat + '</b>. Each team writes down a wager before seeing the clue.</p>' +
    '<div class="fw-grid">' + S.teams.map((t, i) =>
      '<div class="fw" style="--c:' + color(i) + '"><b>' + esc(t.name) + ' · ' + t.score + '</b>' +
      '<label for="fw' + i + '">Wager (0 to ' + Math.max(t.score, 0) + ')</label>' +
      '<input id="fw' + i + '" type="number" min="0" max="' + Math.max(t.score, 0) + '" step="50" value="0" inputmode="numeric"></div>').join('') +
    '</div><div class="err" id="fwErr"></div>' +
    '<div class="b-bar"><span class="spacer"></span><button type="button" class="btn line" id="cancel">Back to board</button>' +
    '<button type="button" class="btn primary" id="fwGo">Lock wagers and show the clue</button></div>');
  $('cancel').onclick = closeSlot;
  $('fwGo').onclick = () => {
    const wagers = [];
    for (let i = 0; i < S.teams.length; i++) {
      const w = Math.round(+$('fw' + i).value), max = Math.max(S.teams[i].score, 0);
      if (!(w >= 0 && w <= max)) { $('fwErr').textContent = S.teams[i].name + ' can wager 0 to ' + max + '.'; return; }
      wagers.push(w);
    }
    openSlot(headHTML('Final Jeopardy', '', FINAL.cat, false) +
      '<div class="clue">' + FINAL.q + '</div><div id="ansArea"></div>' +
      '<div class="b-bar" id="bBar">' + timerHTML(FINAL.secs) + '<span class="spacer"></span>' +
      '<button type="button" class="btn primary" id="reveal" data-autofocus>Show answer</button></div>');
    wireTimer(FINAL.secs);
    $('reveal').onclick = () => {
      stopTimer(); S.finalDone = true; save(); renderBoard();
      $('ansArea').innerHTML = '<div class="answer"><p class="ans-lead">' + FINAL.lead + '</p>' + FINAL.a + '</div>' +
        '<div class="award"><div class="label">Score each team\'s wager</div>' + S.teams.map((t, i) =>
          '<div class="who" style="--c:' + color(i) + '"><span>' + esc(t.name) + '</span>' +
          '<button type="button" class="yes" data-team="' + i + '" data-pts="' + wagers[i] + '">+' + wagers[i] + '</button>' +
          '<button type="button" class="no" data-team="' + i + '" data-pts="' + (-wagers[i]) + '">−' + wagers[i] + '</button></div>').join('') + '</div>';
      $('bBar').innerHTML = '<span class="spacer"></span><button type="button" class="btn primary" id="done">See final scores</button>';
      $('done').onclick = closeSlot; $('done').focus();
      $('ansArea').querySelectorAll('.award button').forEach(b => b.onclick = () => {
        S.teams[+b.dataset.team].score += +b.dataset.pts; save(); renderTally();
        const who = b.closest('.who'); who.classList.add('done'); who.querySelectorAll('button').forEach(x => x.disabled = true);
      });
    };
  };
}

function askReset() {
  openSlot(headHTML('New game', '', '', false) +
    '<div class="confirm"><p>Clear all scores and put every clue back on the board?</p><p class="hint">Team names stay.</p></div>' +
    '<div class="b-bar"><span class="spacer"></span><button type="button" class="btn line" id="cancel" data-autofocus>Keep playing</button>' +
    '<button type="button" class="btn primary" id="doReset">Start a new game</button></div>');
  $('cancel').onclick = closeSlot;
  $('doReset').onclick = () => {
    const names = S.teams.map(t => ({ name: t.name, score: 0 }));
    S = freshState(); S.teams = names; save(); renderBoard(); renderTally(); closeSlot();
  };
}

/* ================= events ================= */
$('board').addEventListener('click', e => { const t = e.target.closest('.tile'); if (t) openTile(t.dataset.id); });
$('finalBtn').onclick = openFinal;
$('resetBtn').onclick = askReset;
$('tally').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.adj) { S.teams[+b.dataset.i].score += +b.dataset.adj; save(); renderTally(); }
});
$('tally').addEventListener('change', e => { if (e.target.id === 'teamCount') setTeamCount(e.target.value); });
$('tally').addEventListener('input', e => { if (e.target.dataset.i != null) { S.teams[+e.target.dataset.i].name = e.target.value; save(); } });
$('slot').addEventListener('click', e => { if (e.target === $('slot')) closeSlot(); });
document.addEventListener('keydown', e => {
  if (!$('slot').classList.contains('open')) return;
  if (e.key === 'Escape') closeSlot();
  if (e.key === 'Tab') { // keep focus inside the ballot
    const f = [...$('ballot').querySelectorAll('button:not([disabled]), input')];
    if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});

function start(snap) { S = load(snap); renderBoard(); renderTally(); }
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
